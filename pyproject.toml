[project]
name = "nextrecordable"
version = "0.2.0"
description = "Establishment-level injury risk from OSHA's public injury logs and enforcement records"
requires-python = ">=3.11"
authors = [{ name = "Andrew Morrissey" }]
readme = "README.md"
# Upper bounds on major versions: splink 5.0 changed its API and broke every
# fresh install of an earlier version of this project overnight.
dependencies = [
    "duckdb>=1.1,<2",
    "fastapi>=0.110,<1",
    "httpx>=0.27,<1",
    "lightgbm>=4.0,<5",
    "numpy>=1.26,<3",
    "pandas>=2.0,<4",
    "python-multipart>=0.0.9",
    "rich>=13.0,<16",
    "scikit-learn>=1.4,<2",
    "scipy>=1.11,<2",
    "typer>=0.12,<1",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["ruff>=0.5", "pytest>=8.0"]

[project.scripts]
nextrecordable = "nextrecordable.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nextrecordable"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",  # long SQL strings
    "B008",  # FastAPI's File()/Depends() in defaults is the documented pattern
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning:starlette.*",
    "ignore:.*httpx.*:DeprecationWarning",
]

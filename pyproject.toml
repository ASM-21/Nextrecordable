[project]
name = "osha-risk"
version = "0.0.1"
description = "Establishment-level injury risk intelligence from OSHA's Injury Tracking Application"
requires-python = ">=3.11"
authors = [{ name = "Andrew" }]
readme = "README.md"
dependencies = [
    "duckdb>=1.0",
    "httpx>=0.27",
    "rich>=13.0",
    "typer>=0.12",
    "numpy>=1.26",
    "pandas>=2.0",
    "lightgbm>=4.0",
    "scikit-learn>=1.4",
    "splink>=4.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["ruff>=0.5", "pytest>=8.0", "jupyterlab", "ipykernel"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["osha_risk"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",  # let the formatter handle line length
    "B008",  # FastAPI's Depends()/File()/Query() in defaults is the documented pattern
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning:splink.*",
    "ignore::DeprecationWarning:starlette.*",
]

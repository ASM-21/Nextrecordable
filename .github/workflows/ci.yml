name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project (with dev extras)
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: pytest -v

  # Runs on a schedule to catch OSHA/DOL URL rot before it silently breaks
  # download.py. Does NOT run on every push since it hits live network.
  # See config.py: URLs are manually verified periodically; this job just
  # flags when they've gone stale.
  url-healthcheck:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: pip install -e .
      - name: Check OSHA ITA URLs respond
        run: |
          python -c "
          import sys
          import httpx
          from osha_risk.config import ITA_SUMMARY_URLS

          failed = []
          for year, url in ITA_SUMMARY_URLS.items():
              try:
                  r = httpx.head(url, follow_redirects=True, timeout=15.0)
                  status = r.status_code
              except Exception as e:
                  status = f'ERROR: {e}'
              print(f'{year}: {status}  {url}')
              if not (isinstance(status, int) and status < 400):
                  failed.append(year)

          if failed:
              print(f'::warning::Stale/broken URLs for years: {failed}. Update osha_risk/config.py')
          "
        continue-on-error: true  # informational only, never blocks CI

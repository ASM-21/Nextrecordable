name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly run against the newest dependency versions allowed by pyproject,
  # so an upstream release that breaks us shows up here before a user hits it.
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  # Build the image and start it on a synthetic database: the Dockerfile,
  # the server's startup path and the data notice, end to end.
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Synthetic database
        run: python scripts/build_synthetic_db.py data 600
      - name: Build image
        run: docker build -t nextrecordable:ci .
      - name: Start and check
        run: |
          chmod -R a+rwX data
          docker run -d --name nr -p 8000:8000 -v "$PWD/data:/app/data" nextrecordable:ci
          for i in $(seq 1 60); do curl -fsS localhost:8000/health > health.json && break; sleep 2; done
          cat health.json
          python -c "import json; h = json.load(open('health.json')); assert h['status'] == 'ok' and h['data_notice'].startswith('SYNTHETIC DATA'), h"
          curl -fsS localhost:8000/pricing | grep -q '\$79/mo'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8000/sst-exposure-pdf -H 'Content-Type: application/json' -d '{"name":"x","state":"IL","zip_code":"60601"}')" = "401"
          docker inspect --format '{{.State.Health.Status}}' nr || true
      - name: Logs on failure
        if: failure()
        run: docker logs nr || true

  # OSHA renames its download files now and then. Informational only.
  source-urls:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Check OSHA download URLs
        run: python scripts/check_source_urls.py

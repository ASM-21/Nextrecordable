name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly run against the newest dependency versions allowed by pyproject,
  # so an upstream release that breaks us shows up here before a user hits it.
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  # OSHA renames its download files now and then. Informational only.
  source-urls:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Check OSHA download URLs
        run: python scripts/check_source_urls.py

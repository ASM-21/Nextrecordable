# One small host: the API plus Caddy, which gets and renews a Let's Encrypt
# certificate for $DOMAIN on its own. Run from this directory:
#   docker compose --env-file .env up -d
services:
  app:
    build: ..
    restart: unless-stopped
    env_file: .env
    volumes:
      - ../data:/app/data
    expose:
      - "8000"

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
